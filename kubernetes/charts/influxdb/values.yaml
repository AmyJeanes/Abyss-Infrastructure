# Stay on InfluxDB 2.x: 3.x is a different product with no in-place upgrade.
image:
  repository: influxdb
  tag: 2.10.1@sha256:94e98bf5a07587c91bac4f6059aa2ddc172cd246bbd296852a30654192a38a03
# Only used to initialise an empty volume.
setup:
  username: admin
  organization: primary
  bucket: primary
auth:
  adminPassword: "" # set in CLI
  adminToken: "" # set in CLI
nodePort: 30000
resources:
  requests:
    cpu: 10m
    memory: 500Mi
  limits:
    memory: 500Mi
