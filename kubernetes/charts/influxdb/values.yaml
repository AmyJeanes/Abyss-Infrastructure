# Stay on InfluxDB 2.x: 3.x is a different product with no in-place upgrade.
image:
  repository: influxdb
  tag: 2.9.1@sha256:6682b6e798b7a5ca8688af3bba576f136f21d022a0796c59a723fc98879f14fd
# Only used to initialise an empty volume.
setup:
  username: admin
  organization: primary
  bucket: primary
auth:
  adminPassword: "" # set in CLI
  adminToken: "" # set in CLI
nodePort: 30000
resources:
  requests:
    cpu: 10m
    memory: 500Mi
  limits:
    memory: 500Mi
