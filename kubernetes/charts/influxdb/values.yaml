# Stay on InfluxDB 2.x: 3.x is a different product with no in-place upgrade.
image:
  repository: influxdb
  tag: 2.9.1@sha256:e4572d094ac3272f06528ea904ce6b4cb3bb19be2db3b3b1acbd27ba5c3a73e2
# Only used to initialise an empty volume.
setup:
  username: admin
  organization: primary
  bucket: primary
auth:
  adminPassword: "" # set in CLI
  adminToken: "" # set in CLI
nodePort: 30000
resources:
  requests:
    cpu: 10m
    memory: 500Mi
  limits:
    memory: 500Mi
