# Stay on InfluxDB 2.x: 3.x is a different product with no in-place upgrade.
image:
  repository: influxdb
  tag: 2.10.1@sha256:33f4eef7ca7859f3c24021c5fa20a4ca7d1d34f049bb011c32787a35cf096b85
# Only used to initialise an empty volume.
setup:
  username: admin
  organization: primary
  bucket: primary
auth:
  adminPassword: "" # set in CLI
  adminToken: "" # set in CLI
nodePort: 30000
resources:
  requests:
    cpu: 10m
    memory: 500Mi
  limits:
    memory: 500Mi
