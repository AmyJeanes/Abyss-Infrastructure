apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flow-sync
  template:
    metadata:
      labels:
        app: flow-sync
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: flow-sync
        image: {{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: FLOW_SYNC_ADMIN_TOKEN_FILE
          value: /run/secrets/flow-sync/admin-token
        # Only ingress-nginx reaches the server, and it sets X-Forwarded-For to the client it saw.
        - name: FLOW_SYNC_TRUST_PROXY
          value: "1"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: admin-token
          mountPath: /run/secrets/flow-sync
          readOnly: true
        resources: {{ toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: flow-sync
      - name: tmp
        emptyDir: {}
      - name: admin-token
        secret:
          secretName: flow-sync
