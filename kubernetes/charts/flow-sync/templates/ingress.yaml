apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flow-sync
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: {{ required "maxSize is required" .Values.maxSize | quote }}
    # Keeps the live WebSocket (Play on, remote control) open between messages.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ required "ingress.host is required" .Values.ingress.host | quote }}
      secretName: flow-sync-tls
  rules:
  - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flow-sync
            port:
              number: 80
