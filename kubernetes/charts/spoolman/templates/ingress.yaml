apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spoolman
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ required "whitelistSourceRange is required" .Values.whitelistSourceRange | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ required "maxSize is required" .Values.maxSize | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ required "ingress.host is required" .Values.ingress.host | quote }}
      secretName: spoolman-tls
  rules:
  - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spoolman
            port:
              number: 80
