# A major version bump is NOT a drop-in upgrade: the image refuses to start while the
# volume holds a cluster from another major. Dump and restore (or pg_upgrade) is required.
image:
  repository: postgres
  tag: 18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
auth:
  postgresPassword: "" # set in CLI
nodePort: 30002
resources:
  requests:
    cpu: 10m
    memory: 750Mi
  limits:
    memory: 750Mi
exporter:
  image:
    repository: quay.io/prometheuscommunity/postgres-exporter
    tag: v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi
