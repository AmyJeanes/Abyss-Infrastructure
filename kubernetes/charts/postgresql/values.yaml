# A major version bump is NOT a drop-in upgrade: the image refuses to start while the
# volume holds a cluster from another major. Dump and restore (or pg_upgrade) is required.
image:
  repository: postgres
  tag: 18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
auth:
  postgresPassword: "" # set in CLI
nodePort: 30002
resources:
  requests:
    cpu: 10m
    memory: 750Mi
  limits:
    memory: 750Mi
exporter:
  image:
    repository: quay.io/prometheuscommunity/postgres-exporter
    tag: v0.21.1@sha256:a88794758ad461c75f3825b51cde4bde730bdff04b3b24d00efe14217e41f615
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi
